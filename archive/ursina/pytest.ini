[pytest]
# pytest's built-in doctest collector has an implicit `test*.txt` glob, so a bare
# `pytest` run from the repository root treats every `test*.txt` file as an
# encoding-sensitive doctest source. Non-doctest artefacts in the root that match
# that name (for example the UTF-16 `tests_final_report.txt` log) aborted
# collection with a UnicodeDecodeError before any test ran.
#
# Clearing the implicit glob means `.txt` files are never collected by accident,
# while every real test module is still collected and nothing is excluded.
# Doctests remain available explicitly: `pytest --doctest-modules` for modules,
# or `pytest --doctest-glob='test*.txt'` for text files.
addopts = --doctest-glob=
