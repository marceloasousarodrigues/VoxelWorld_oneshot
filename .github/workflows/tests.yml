name: Tests

# The verified environment is Windows x64 (see MILESTONES.md, M16 follow-up
# "Test Infrastructure Hardening"), so this workflow uses a Windows runner.
# Linux and macOS compatibility have not been tested.

on:
  push:
  pull_request:

jobs:
  test:
    name: CPython 3.14 on Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q .

      - name: Run the test suite
        run: python -m pytest -q
